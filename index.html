<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ジョグ記録</title>
<link rel="manifest" href="manifest.json">
  <!-- PWA・全画面表示（URLバー非表示）設定 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ジョグ記録">
  <meta name="theme-color" content="#1a73e8">

  <!-- ホーム画面アプリアイコン（ランナーアイコン） -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/running.png">
  <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/192/running.png">

  <!-- グラフ描画ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8f9fa;
      color: #333;
    }
    .grid {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      flex: 1;
      background: #e8f0fe;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .stat-title {
      font-size: 0.8rem;
      color: #555;
    }
    .stat-val {
      font-size: 1.4rem;
      font-weight: bold;
      color: #1a73e8;
      margin-top: 4px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 1.05rem;
      color: #1a73e8;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    input {
      width: 100%;
      padding: 11px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button.btn-main {
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background: #9aa0a6;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 9px 4px;
      text-align: left;
    }
    th {
      color: #666;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    .btn-edit {
      background: #e8f0fe;
      color: #1a73e8;
      margin-right: 4px;
    }
    .btn-del {
      background: #fce8e6;
      color: #d93025;
    }
    #msg {
      margin-top: 10px;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- 集計カード -->
  <div class="grid">
    <div class="stat-card">
      <div class="stat-title">今月の累積距離</div>
      <div class="stat-val" id="thisMonth">-- km</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">今年の累積距離</div>
      <div class="stat-val" id="thisYear">-- km</div>
    </div>
  </div>

  <!-- 入力フォーム -->
  <div class="card">
    <h3 id="formTitle">🏃‍♂️ ジョグ記録入力</h3>
    <form id="jogForm">
      <input type="hidden" id="editRow" value="">

      <label>日付</label>
      <input type="date" id="date" required>

      <label>距離 (km)</label>
      <input type="number" step="0.01" id="distance" placeholder="例: 5.0" required inputmode="decimal">

      <label>場所</label>
      <input type="text" id="location" placeholder="例: 目黒, 樟葉" required>

      <button type="submit" id="btn" class="btn-main">登録する</button>
      <button type="button" id="cancelBtn" class="btn-main" style="background:#5f6368; display:none; margin-top:8px;">編集をキャンセル</button>
    </form>
    <div id="msg"></div>
  </div>

  <!-- 月別推移グラフ -->
  <div class="card">
    <h3>📊 月別走行距離</h3>
    <canvas id="jogChart" height="180"></canvas>
  </div>

  <!-- 直近ログ一覧 -->
  <div class="card">
    <h3>📋 直近ログ（修正・削除）</h3>
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>距離</th>
          <th>場所</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr><td colspan="4">読込中...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // ▼▼▼ ここにステップ1でコピーしたGASのURLを貼り付けます ▼▼▼
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzXegF4MEP5WMnZGbT35CnUUrgP8u8ZRBT03FzaKd4RPHZESzy7mQDEpvahxh1AK6vVsw/exec";
    // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    let myChart = null;
    let currentRecords = [];

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    window.onload = loadData;

    async function loadData() {
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        renderUI(data);
      } catch (err) {
        document.getElementById('msg').innerText = '通信エラー: ' + err.message;
      }
    }

    function renderUI(data) {
      document.getElementById('thisMonth').innerText = data.thisMonth + ' km';
      document.getElementById('thisYear').innerText = data.thisYear + ' km';

      currentRecords = data.records || [];
      const tbody = document.getElementById('historyBody');
      tbody.innerHTML = '';

      if (currentRecords.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">データがありません</td></tr>';
      } else {
        currentRecords.forEach(r => {
          tbody.innerHTML += `
            <tr>
              <td>${r.date.slice(5)}</td>
              <td>${r.distance}km</td>
              <td>${r.location}</td>
              <td>
                <button class="btn-sm btn-edit" onclick="startEdit(${r.row})">修正</button>
                <button class="btn-sm btn-del" onclick="deleteRecord(${r.row})">削除</button>
              </td>
            </tr>`;
        });
      }

      // グラフ描画
      const labels = Object.keys(data.monthlyData || {}).sort();
      const dists = labels.map(k => data.monthlyData[k]);
      const ctx = document.getElementById('jogChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '月間 (km)',
            data: dists,
            backgroundColor: '#1a73e8',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    // 登録・更新処理
    document.getElementById('jogForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      const editRow = document.getElementById('editRow').value;

      btn.disabled = true;
      msg.style.color = '#555';
      msg.innerText = '通信中...';

      const payload = {
        action: editRow ? 'update' : 'add',
        row: editRow || null,
        date: document.getElementById('date').value,
        distance: document.getElementById('distance').value,
        location: document.getElementById('location').value
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === 'success') {
          msg.style.color = '#1e7e34';
          msg.innerText = editRow ? '修正を保存しました。' : '登録が完了しました。';
          resetForm();
          renderUI(result.data);
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        msg.style.color = '#d93025';
        msg.innerText = 'エラー: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });

    // 修正モード開始
    function startEdit(row) {
      const target = currentRecords.find(r => r.row === row);
      if (!target) return;

      document.getElementById('editRow').value = row;
      document.getElementById('date').value = target.date;
      document.getElementById('distance').value = target.distance;
      document.getElementById('location').value = target.location;

      document.getElementById('formTitle').innerText = '✏️ 記録の修正';
      document.getElementById('btn').innerText = '修正を保存する';
      document.getElementById('cancelBtn').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // キャンセルボタン
    document.getElementById('cancelBtn').addEventListener('click', resetForm);

    function resetForm() {
      document.getElementById('editRow').value = '';
      document.getElementById('distance').value = '';
      document.getElementById('location').value = '';
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      document.getElementById('formTitle').innerText = '🏃‍♂️ ジョグ記録入力';
      document.getElementById('btn').innerText = '登録する';
      document.getElementById('cancelBtn').style.display = 'none';
    }

    // 削除処理
    async function deleteRecord(row) {
      if (!confirm('この記録を削除しますか？')) return;
      const msg = document.getElementById('msg');
      msg.style.color = '#555';
      msg.innerText = '削除中...';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete', row: row })
        });
        const result = await res.json();
        if (result.status === 'success') {
          msg.style.color = '#1e7e34';
          msg.innerText = '削除しました。';
          renderUI(result.data);
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        alert('削除失敗: ' + err.message);
      }
    }
if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
