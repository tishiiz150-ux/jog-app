<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ジョグ記録</title>
<link rel="manifest" href="manifest.json">
  <!-- PWA・全画面表示（URLバー非表示）設定 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ジョグ記録">
  <meta name="theme-color" content="#1a73e8">

  <!-- ホーム画面アプリアイコン（ランナーアイコン） -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/running.png">
  <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/192/running.png">

  <!-- グラフ描画ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8f9fa;
      color: #333;
    }
    .grid {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      flex: 1;
      background: #e8f0fe;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .stat-title {
      font-size: 0.8rem;
      color: #555;
    }
    .stat-val {
      font-size: 1.4rem;
      font-weight: bold;
      color: #1a73e8;
      margin-top: 4px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 1.05rem;
      color: #1a73e8;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    input {
      width: 100%;
      padding: 11px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button.btn-main {
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background: #9aa0a6;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 9px 4px;
      text-align: left;
    }
    th {
      color: #666;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    .btn-edit {
      background: #e8f0fe;
      color: #1a73e8;
      margin-right: 4px;
    }
    .btn-del {
      background: #fce8e6;
      color: #d93025;
    }
    #msg {
      margin-top: 10px;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- 集計カード -->
  <div class="grid">
    <div class="stat-card">
      <div class="stat-title">今月の累積距離</div>
      <div class="stat-val" id="thisMonth">-- km</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">今年の累積距離</div>
      <div class="stat-val" id="thisYear">-- km</div>
    </div>
  </div>

  <!-- 入力フォーム -->
  <div class="card">
    <h3 id="formTitle">🏃‍♂️ ジョグ記録入力</h3>
    <form id="jogForm">
      <input type="hidden" id="editRow" value="">

      <label>日付</label>
      <input type="date" id="date" required>

      <label>距離 (km)</label>
      <input type="number" step="0.01" id="distance" placeholder="例: 5.0" required inputmode="decimal">

      <label>場所</label>
      <input type="text" id="location" placeholder="例: 目黒, 樟葉" required>

      <button type="submit" id="btn" class="btn-main">登録する</button>
      <button type="button" id="cancelBtn" class="btn-main" style="background:#5f6368; display:none; margin-top:8px;">編集をキャンセル</button>
    </form>
    <div id="msg"></div>
  </div>

  <!-- 月別推移グラフ -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h3 style="margin:0;">📊 月別走行距離</h3>
        <select id="yearSelect" style="width:auto; padding:5px 12px; font-size:0.95rem; font-weight:bold; border:1px solid #1a73e8; border-radius:6px; color:#1a73e8; background:#fff; cursor:pointer;">
        </select>
      </div>
      <div id="yearTotal" style="font-size:0.9rem; color:#555; margin-bottom:10px; font-weight:600;"></div>
      <canvas id="jogChart" height="180"></canvas>
    </div>

  <!-- 直近ログ一覧 -->
  <div class="card">
    <h3>📋 直近ログ（修正・削除）</h3>
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>距離</th>
          <th>場所</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr><td colspan="4">読込中...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // ▼▼▼ ここにステップ1でコピーしたGASのURLを貼り付けます ▼▼▼
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzXegF4MEP5WMnZGbT35CnUUrgP8u8ZRBT03FzaKd4RPHZESzy7mQDEpvahxh1AK6vVsw/exec";
    // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    let myChart = null;
    let currentRecords = [];

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    window.onload = loadData;

    async function loadData() {
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        renderUI(data);
      } catch (err) {
        document.getElementById('msg').innerText = '通信エラー: ' + err.message;
      }
    }

    function renderUI(data) {
      document.getElementById('thisMonth').innerText = data.thisMonth + ' km';
      document.getElementById('thisYear').innerText = data.thisYear + ' km';

      currentRecords = data.records || [];
      const tbody = document.getElementById('historyBody');
      tbody.innerHTML = '';

      if (currentRecords.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">データがありません</td></tr>';
      } else {
        currentRecords.forEach(r => {
          tbody.innerHTML += `
            <tr>
              <td>${r.date.slice(5)}</td>
              <td>${r.distance}km</td>
              <td>${r.location}</td>
              <td>
                <button class="btn-sm btn-edit" onclick="startEdit(${r.row})">修正</button>
                <button class="btn-sm btn-del" onclick="deleteRecord(${r.row})">削除</button>
              </td>
            </tr>`;
        });
      }

      // 過去13年分（2013〜2025年）の月別実績データ
      const historicalMonthlyData = {
      "2013/12": 264.63,
      "2014/01": 44.8,
      "2014/02": 57.0,
      "2014/03": 87.5,
      "2014/04": 119.86,
      "2014/05": 140.4,
      "2014/06": 120.1,

      "2014/12": 144.78,
      "2015/01": 156.81,

      "2015/03": 120.12,
      "2015/04": 158.29,
      "2015/05": 176.53,
      "2015/06": 151.29,
      "2015/07": 155.86,
      "2015/08": 182.3,
      "2015/09": 135.0,
      "2015/10": 175.26,
      "2015/11": 140.58,
      "2015/12": 118.98,
      "2016/01": 150.1,
      "2016/02": 120.14,
      "2016/03": 183.88,
      "2016/04": 177.62,
      "2016/05": 152.46,
      "2016/06": 150.09,
      "2016/07": 152.54,
      "2016/08": 153.94,
      "2016/09": 150.01,
      "2016/10": 168.0,
      "2016/11": 150.23,
      "2016/12": 101.52,
      "2017/01": 149.43,
      "2017/02": 133.98,
      "2017/03": 120.42,
      "2017/04": 164.4,
      "2017/05": 154.42,
      "2017/06": 151.08,
      "2017/07": 176.38,
      "2017/08": 150.32,
      "2017/09": 152.9,
      "2017/10": 120.59,
      "2017/11": 171.7,
      "2017/12": 170.93,
      "2018/01": 150.24,
      "2018/02": 128.25,
      "2018/03": 158.31,
      "2018/04": 159.32,
      "2018/05": 136.13,
      "2018/06": 150.51,
      "2018/07": 132.52,
      "2018/08": 133.15,
      "2018/09": 160.52,
      "2018/10": 155.25,
      "2018/11": 155.76,
      "2018/12": 197.14,
      "2019/01": 129.0,

      "2019/12": 184.46,

      "2020/05": 223.38,
      "2020/06": 101.86,
      "2020/07": 105.7,

      "2020/09": 169.7,
      "2020/10": 159.61,

      "2021/01": 54.6,

      "2024/12": 103.6,
      "2025/01": 74.8,

      "2025/06": 63.7,
      "2025/07": 53.5,
      "2025/08": 37.6,
      "2025/09": 37.8,
      "2025/10": 21.5,
      "2025/11": 54.4,
      "2025/12": 26.3
};

      // 最新データ（GAS取得）と過去実績を統合
      const monthlyData = Object.assign({}, historicalMonthlyData, data.monthlyData || {});
      const allMonths = Object.keys(monthlyData).sort();
      
      // 年リスト（新しい順）
      const years = [...new Set(allMonths.map(k => k.split('/')[0]))].filter(y => y && y.length === 4).sort().reverse();
      
      const yearSelect = document.getElementById('yearSelect');
      const prevSelectedYear = yearSelect.value;
      yearSelect.innerHTML = '';
      
      years.forEach(yr => {
        const opt = document.createElement('option');
        opt.value = yr;
        opt.innerText = yr + '年';
        yearSelect.appendChild(opt);
      });
      
      // デフォルトは今年（2026年）または直前の選択年
      const currentYearStr = new Date().getFullYear().toString();
      const defaultYear = years.includes(prevSelectedYear) ? prevSelectedYear : (years.includes(currentYearStr) ? currentYearStr : years[0]);
      yearSelect.value = defaultYear;
      
      function updateChartForYear(yr) {
        const labels = [];
        const dists = [];
        let annualSum = 0;
        
        for (let m = 1; m <= 12; m++) {
          const mStr = m.toString().padStart(2, '0');
          const key = yr + '/' + mStr;
          labels.push(m + '月');
          const val = monthlyData[key] || 0;
          dists.push(Math.round(val * 10) / 10);
          annualSum += val;
        }
        
        document.getElementById('yearTotal').innerText = `${yr}年 年間合計: ${annualSum.toFixed(1)} km`;
        
        const ctx = document.getElementById('jogChart').getContext('2d');
        if (myChart) myChart.destroy();
        
        myChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: `${yr}年 月間 (km)`,
              data: dists,
              backgroundColor: '#1a73e8',
              borderRadius: 4
            }]
          },
          options: {
            responsive: true,
            scales: { y: { beginAtZero: true } }
          }
        });
      }
      
      yearSelect.onchange = function() {
        updateChartForYear(this.value);
      };
      
      if (defaultYear) {
        updateChartForYear(defaultYear);
      }
    }

    // 登録・更新処理
    document.getElementById('jogForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      const editRow = document.getElementById('editRow').value;

      btn.disabled = true;
      msg.style.color = '#555';
      msg.innerText = '通信中...';

      const payload = {
        action: editRow ? 'update' : 'add',
        row: editRow || null,
        date: document.getElementById('date').value,
        distance: document.getElementById('distance').value,
        location: document.getElementById('location').value
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === 'success') {
          msg.style.color = '#1e7e34';
          msg.innerText = editRow ? '修正を保存しました。' : '登録が完了しました。';
          resetForm();
          renderUI(result.data);
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        msg.style.color = '#d93025';
        msg.innerText = 'エラー: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });

    // 修正モード開始
    function startEdit(row) {
      const target = currentRecords.find(r => r.row === row);
      if (!target) return;

      document.getElementById('editRow').value = row;
      document.getElementById('date').value = target.date;
      document.getElementById('distance').value = target.distance;
      document.getElementById('location').value = target.location;

      document.getElementById('formTitle').innerText = '✏️ 記録の修正';
      document.getElementById('btn').innerText = '修正を保存する';
      document.getElementById('cancelBtn').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // キャンセルボタン
    document.getElementById('cancelBtn').addEventListener('click', resetForm);

    function resetForm() {
      document.getElementById('editRow').value = '';
      document.getElementById('distance').value = '';
      document.getElementById('location').value = '';
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      document.getElementById('formTitle').innerText = '🏃‍♂️ ジョグ記録入力';
      document.getElementById('btn').innerText = '登録する';
      document.getElementById('cancelBtn').style.display = 'none';
    }

    // 削除処理
    async function deleteRecord(row) {
      if (!confirm('この記録を削除しますか？')) return;
      const msg = document.getElementById('msg');
      msg.style.color = '#555';
      msg.innerText = '削除中...';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete', row: row })
        });
        const result = await res.json();
        if (result.status === 'success') {
          msg.style.color = '#1e7e34';
          msg.innerText = '削除しました。';
          renderUI(result.data);
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        alert('削除失敗: ' + err.message);
      }
    }
if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
